# Requires the provisioned encrypted ZFS mount. No cloud credentials belong here.
services:
  eufy-bridge:
    build: .
    image: eufy-bridge-secure:0.7.3
    container_name: eufy-bridge
    user: "10001:10001"
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    environment:
      BRIDGE_HOST: "0.0.0.0"
      BRIDGE_PORT: "3012"
      GO2RTC_API_PORT: "1985"
      GO2RTC_RTSP_PORT: "8556"
      GO2RTC_WEBRTC_PORT: "8557"
      BRIDGE_EVENT_LOG: "0"
      BRIDGE_DEBUG: "0"
      BRIDGE_DEBUG_P2P: "0"
    volumes:
      - type: bind
        source: /media-server/secure-eufy
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /etc/eufy-bridge/runtime-guard.json
        target: /run/eufy-storage.json
        read_only: true
        bind:
          create_host_path: false
    logging:
      options:
        max-size: "5m"
        max-file: "2"
